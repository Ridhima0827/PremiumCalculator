<script>
    let positiveSum = 0;
    let negativeSum = 0;
    let zeroes = 0;
    const arr = [1, -1, -90, 87, 23, 0, 5, 6];
    for (var i = 0; i < arr.length; i++) {
        if (arr[i] == 0) {
            zeroes++;
        } else if (arr[i] > 0) {
            positiveSum += arr[i];
        } else {
            negativeSum += arr[i];
        }
    }
    console.log(positiveSum);
    console.log(negativeSum);
    console.log(zeroes);

</script>
