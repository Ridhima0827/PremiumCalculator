<script>
    const n1 = 1;
    const n2 = 100;
    for (var i = n1; i < n2; i++) {
        if (isPrime(i)) {
            console.log(i);
        }
    }
    function isPrime(n) {
        if (n < 2) {
            return false;
        }
        for (var i = 2; i <= Math.sqrt(n); i++) {
            if (n % i == 0) {
                return false;
            }
        }
        return true;

    }
</script>
