<script>
    var num = 1231;
    var original = num;
    var rev = 0;
    while (num != 0) {
        var digit = num % 10;
        rev = rev * 10 + digit;
        num = Math.floor(num / 10);
    }
    if (rev == original) {
        console.log("It is a Palindrome Number");
    } else {
        console.log("It is not a Palindrome Number")
    }
</script>
