<script>
    var num = 5837462;
    var eSum = 0;
    var oSum = 0;
    while (num != 0) {
        var digit = num % 10;
        if (digit % 2 == 0) {
            eSum += digit;
        } else {
            oSum += digit;
        }
        num = Math.floor(num / 10);
    }
    console.log(eSum);
    console.log(oSum);
</script>
